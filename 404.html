<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found — Benjamin Golub</title>
  <meta name="description" content="Page not found.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1a1a1a;
      --dim: #666666;
      --link: #0969da;
      --link-hover: #0550ae;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #e6edf3;
        --dim: #8b949e;
        --link: #58a6ff;
        --link-hover: #79c0ff;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      padding: 56px 24px;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .desc {
      color: var(--dim);
      margin-bottom: 24px;
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--link-hover);
    }
  </style>
</head>
<body>
  <main>
    <h1>404 Not Found</h1>
    <p class="desc">The page you were looking for doesn't exist.</p>
    <p><a href="/">← Back to home</a></p>
  </main>
</body>
</html>
